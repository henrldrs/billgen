[project]
name = "billgen-core"
version = "0.0.1"
description = "BillGen — pure business logic (models, services, rules, PDF, UBL)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "jinja2>=3.1",
  # The PDF engine in the container: Playwright's headless Chromium. After
  # install run: python -m playwright install chromium. On Windows the Edge
  # already installed prints instead and this is never imported (T-21) — the
  # desktop runtime leaves it out (scripts/build_sidecar_runtime.py).
  "playwright>=1.49",
  # AES-256-GCM and scrypt for the portable backup (core/backup/sealed.py).
  # Declared HERE, not only in billgen-desktop, because core imports it: the
  # same undeclared-but-installed dependency produced a packaged runtime with
  # no licence verification in it (T-20), and the fix is to declare it where
  # the import is.
  "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
