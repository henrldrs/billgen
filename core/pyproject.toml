[project]
name = "billgen-core"
version = "0.0.1"
description = "BillGen — pure business logic (models, services, rules, PDF, UBL)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "jinja2>=3.1",
  "weasyprint>=62",
  "lxml>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
