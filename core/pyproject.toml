[project]
name = "billgen-core"
version = "0.0.1"
description = "BillGen — pure business logic (models, services, rules, PDF, UBL)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "jinja2>=3.1",
  # The PDF engine: headless Chromium (cross-platform, incl. Windows/desktop).
  # After install run: python -m playwright install chromium
  "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
