[project]
name = "billgen-desktop"
version = "0.0.1"
description = "BillGen — the local sidecar: bootstrap, licensing, per-machine paths"
requires-python = ">=3.11"
dependencies = [
  "billgen-api",
  # Ed25519 licence verification (`licensing.py`). Declared here as of
  # 2026-09-10: it was imported and declared nowhere, which worked on every
  # machine that happened to have it and produced a runtime with no
  # `cryptography` in it the first time one was built from the lockfile
  # (T-20). `scripts/check_sidecar_runtime.py` is what found it.
  "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
billgen-api = { workspace = true }
