[project]
name = "billgen-db"
version = "0.0.1"
description = "BillGen — SQLAlchemy + Alembic persistence layer"
requires-python = ">=3.11"
dependencies = [
  "billgen-core",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
billgen-core = { workspace = true }
