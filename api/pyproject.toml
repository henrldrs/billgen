[project]
name = "billgen-api"
version = "0.0.1"
description = "BillGen — FastAPI HTTP surface"
requires-python = ">=3.11"
dependencies = [
  "billgen-core",
  "billgen-db",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyjwt>=2.8",
  "argon2-cffi>=23",
  "pydantic-settings>=2.4",
  "structlog>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
billgen-core = { workspace = true }
billgen-db = { workspace = true }
